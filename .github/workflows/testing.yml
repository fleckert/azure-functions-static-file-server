on:
  workflow_dispatch:
  push:
    branches: 
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read
  id-token: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - run: dotnet build StaticFilesHandler/StaticFilesHandler.csproj --configuration Release

  test-local-hosting:
    needs: [ test-build ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - run: |
        ./scripts/appBuild.sh                          \
          StaticFilesHandler/StaticFilesHandler.csproj \
          dist

    - run: sudo apt-get install -y azure-functions-core-tools-4

    - run: func start &

    - run: ./scripts/appCheck.sh "http://localhost:7071/"

  test-azure-hosting:
    needs: [ test-local-hosting ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: azure/login@v3
      with:
        tenant-id      : ${{ secrets.AZURE_TENANT_ID       }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client-id      : ${{ secrets.AZURE_CLIENT_ID       }}

    - run: sudo apt-get install -y azure-functions-core-tools-4

    - run: |
        ./scripts/deploy.sh                    \
          ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
          azure-functions-static-file-server   \
          sttcflsrvr${{ github.run_id }}${{ github.run_attempt }}

  cleanup-azure-hosting:
    needs: [ test-azure-hosting ]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: azure/login@v3
      with:
        tenant-id      : ${{ secrets.AZURE_TENANT_ID       }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client-id      : ${{ secrets.AZURE_CLIENT_ID       }}

    - run: |
        ./scripts/infraTearDown.sh             \
          ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
          azure-functions-static-file-server   \
          sttcflsrvr${{ github.run_id }}${{ github.run_attempt }}
