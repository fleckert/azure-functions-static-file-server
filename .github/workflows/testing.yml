
on:
  workflow_dispatch:
  push:
    branches: 
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read
  id-token: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - run: dotnet build StaticFilesHandler/StaticFilesHandler.csproj --configuration Release

  test-local-hosting:
    needs: [ test-build ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - run: |
        dotnet publish StaticFilesHandler/StaticFilesHandler.csproj \
            --configuration   Release                               \
            --runtime         'linux-x64'                           \
            --self-contained  true                                  \
            --output          dist                                  \
            --property:DebugSymbols=false                           \
            --property:DebugType=None                               \
            --property:InvariantGlobalization=true                  \
            --property:OutputType=Exe                               \
            --property:PublishSingleFile=true                       \
            --property:PublishTrimmed=true

    - run: sudo apt-get install -y azure-functions-core-tools-4

    - run: func start &

    - run: |
        URL="http://localhost:7071/"

        for i in {1..30}; do
            HTTP=$(curl -s -o index.html -w "%{http_code}" "$URL")
            if [ "$HTTP" = "200" ]; then
                break
            fi
            echo "Waiting for Functions host '$URL' to start... (last status: $HTTP)"
            sleep 2
        done

        [ "$HTTP" = "200" ] || { echo "Expected HTTP 200, got $HTTP"; exit 1; }

        grep -q "azure-functions-static-file-server" index.html || { echo "Unexpected index.html content"; exit 1; }

        diff -q index.html StaticFilesHandler/wwwroot/index.html || { echo "Downloaded index.html does not match source file"; exit 1; }
        
        echo ''
        echo '------------------------------------------------------------'
        echo "index.html content:"
        echo '------------------------------------------------------------'
        echo ''
        cat index.html
        echo ''
        echo '------------------------------------------------------------'
  
  test-azure-hosting:
    needs: [ test-local-hosting ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: azure/login@v3
      with:
        tenant-id      : ${{ secrets.AZURE_TENANT_ID       }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client-id      : ${{ secrets.AZURE_CLIENT_ID       }}

    - run: sudo apt-get install -y azure-functions-core-tools-4

    - run: ./deploy.sh ${{ github.run_id }}${{ github.run_attempt }}

    - run: |
        URL="https://sttcflsrvr${{ github.run_id }}${{ github.run_attempt }}.azurewebsites.net"

        for i in {1..30}; do
            HTTP=$(curl -s -o index.html -w "%{http_code}" "$URL")
            if [ "$HTTP" = "200" ]; then
                break
            fi
            echo "Waiting for Functions host '$URL' to start... (last status: $HTTP)"
            sleep 2
        done

        [ "$HTTP" = "200" ] || { echo "Expected HTTP 200, got $HTTP"; exit 1; }

        grep -q "azure-functions-static-file-server" index.html || { echo "Unexpected index.html content"; exit 1; }

        diff -q index.html StaticFilesHandler/wwwroot/index.html || { echo "Downloaded index.html does not match source file"; exit 1; }

        echo ''
        echo '------------------------------------------------------------'
        echo "index.html content:"
        echo '------------------------------------------------------------'
        echo ''
        cat index.html
        echo ''
        echo '------------------------------------------------------------'
